<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<title>Pad Rai Cha3bi Pro 2027</title>
<style>
:root{
  --bg:#0d0f14; --panel:#161a22; --panel2:#1f2430; --line:#2a303d;
  --txt:#e9ecf2; --mute:#8a93a6; --acc:#ffb020; --red:#ff4d5e; --grn:#3ddc84;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:620px;margin:0 auto}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:8px 12px;cursor:pointer}
button:active{transform:scale(.97)}
/* tabs */
.tabs{display:flex;gap:6px;padding:10px 10px 6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-width:64px;padding:8px 12px;border-radius:10px;background:var(--panel);
  border:1px solid var(--line);font-weight:700;position:relative;text-align:center}
.tab small{display:block;font-weight:500;font-size:10px;color:var(--mute);letter-spacing:.04em}
.tab.on{background:var(--acc);color:#111;border-color:var(--acc)}
.tab.on small{color:#3a2a00}
.tab .live{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--grn)}
.tab.add{min-width:44px;font-size:20px;line-height:1;color:var(--mute)}
/* bar */
.bar{display:flex;align-items:center;gap:6px;padding:4px 10px 6px}
.bpm{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.bpm small{font-size:11px;color:var(--mute);font-weight:600;margin-left:3px}
.beats{display:flex;gap:4px;align-items:center;margin-left:2px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--panel2);border:1px solid var(--line)}
.dot.on{background:var(--acc);border-color:var(--acc)}
.dot.on.first{background:var(--red);border-color:var(--red)}
.barno{font-size:11px;color:var(--mute);min-width:34px;font-variant-numeric:tabular-nums}
.sp{flex:1}
.ib{padding:8px 6px;min-width:38px;font-size:15px}
.ib.on{background:var(--acc);color:#111;border-color:var(--acc)}
.stop{background:#3a1218;border-color:#6b1f2a;color:#ffb3bb;font-weight:700}
.stop.arm{background:var(--red);color:#fff}
/* grid */
.grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  gap:10px;padding:6px 10px 12px;min-height:0}
.pad{position:relative;border-radius:16px;background:var(--panel);border:2px solid var(--line);
  overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;
  touch-action:none;--c:#ffb020;--p:0}
.pad .fill{position:absolute;inset:0;background:var(--c);opacity:.14}
.pad .ring{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;
  background:conic-gradient(var(--c) calc(var(--p)*360deg),rgba(255,255,255,.08) 0)}
.pad .ring::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--panel)}
.pad .nm{position:relative;font-weight:700;font-size:14px;line-height:1.15;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pad .inf{position:relative;font-size:11px;color:var(--mute);margin-top:3px}
.pad .num{position:absolute;top:8px;left:10px;font-size:11px;color:var(--mute);font-weight:700}
.pad.empty{border-style:dashed;align-items:center;justify-content:center;color:var(--mute)}
.pad.empty .plus{font-size:30px;opacity:.6}
.pad.loading .nm::after{content:" …";}
.pad.play{border-color:var(--c);box-shadow:0 0 18px -4px var(--c)}
.pad.play .fill{opacity:.42}
.pad.wait{animation:blink .35s steps(2) infinite;border-color:var(--c)}
.pad.stopping{animation:blink2 .35s steps(2) infinite}
@keyframes blink{50%{background:var(--c)}}
@keyframes blink2{50%{border-color:var(--red)}}
.pad.hit{transform:scale(.97)}
.editing .pad:not(.empty){outline:2px dashed rgba(255,255,255,.25);outline-offset:-6px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:10}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88dvh;overflow:auto;background:var(--panel);
  border-radius:18px 18px 0 0;border-top:1px solid var(--line);padding:16px 16px 24px;z-index:11;
  transform:translateY(105%);transition:transform .2s ease}
.sheet.on{transform:none}
.sheet h3{margin:0 0 12px;font-size:17px}
.row{display:flex;align-items:center;gap:8px;margin:12px 0}
.row label{font-size:13px;color:var(--mute);min-width:74px}
.sheet input[type=text],.sheet input[type=number]{flex:1;background:var(--bg);border:1px solid var(--line);
  color:var(--txt);border-radius:10px;padding:10px;font:inherit;user-select:text;-webkit-user-select:text;min-width:0}
.sheet input[type=range]{flex:1;accent-color:var(--acc)}
.big{font-size:22px;font-weight:800;min-width:70px;text-align:center;font-variant-numeric:tabular-nums}
.seg{display:flex;flex:1;gap:6px}
.seg button{flex:1}
.seg button.on{background:var(--acc);color:#111;border-color:var(--acc);font-weight:700}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw i{width:30px;height:30px;border-radius:50%;display:block;border:3px solid transparent}
.sw i.on{border-color:#fff}
.file{display:block;width:100%;text-align:center;padding:14px;border:1px dashed var(--acc);
  border-radius:12px;color:var(--acc);font-weight:700}
.file input{display:none}
.note{font-size:12px;color:var(--mute);line-height:1.45}
.warn{color:#ffcf70}
.acts{display:flex;gap:8px;margin-top:16px}
.acts button{flex:1;padding:12px}
.danger{background:#3a1218;border-color:#6b1f2a;color:#ffb3bb}
.ok{background:var(--acc);color:#111;border-color:var(--acc);font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:#000;
  border:1px solid var(--line);padding:10px 14px;border-radius:10px;font-size:13px;z-index:20;
  transition:transform .2s;max-width:90vw;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0)}
.pad.locked{border-style:dashed;opacity:.55;align-items:center;justify-content:center}
.pad.locked .lk{font-size:26px}
.key{background:var(--acc);color:#111;border-color:var(--acc);font-weight:800}
.devcode{font-size:30px;font-weight:800;letter-spacing:.08em;text-align:center;padding:14px;background:var(--bg);border:1px dashed var(--acc);border-radius:12px;user-select:text;-webkit-user-select:text}
.sheet textarea{width:100%;min-height:84px;background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px;font:13px/1.4 ui-monospace,monospace;user-select:text;-webkit-user-select:text;word-break:break-all}
.okmsg{color:var(--grn);font-weight:700}
.start{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
.start h1{margin:0;font-size:28px}
.start button{padding:16px 34px;font-size:18px}
</style>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pad Rai 2027">
</head>
<body>
<div id="app">
  <div class="tabs" id="tabs"></div>
  <div class="bar">
    <div class="bpm" id="bpm">98<small>BPM</small></div>
    <div class="beats" id="beats"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    <div class="barno" id="barno"></div>
    <div class="sp"></div>
    <button class="ib key" id="btnKey" style="display:none">🔑</button>
    <button class="ib" id="btnEdit" title="Edit">✎</button>
    <button class="ib" id="btnSet" title="Settings">⚙</button>
    <button class="ib stop" id="btnStop">■</button>
  </div>
  <div class="grid" id="grid"></div>
</div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<div class="start" id="start">
  <img src="icon-192.png" style="border-radius:28px" width="128" height="128" alt=""><h1>Pad Rai Cha3bi<br><span style="color:var(--acc)">PRO 2027</span></h1>
  <div class="note">Pages b tempo, 9 pads f kol page.<br>Loops kaydkhlo m3a l'mesure automatiquement.<br><br>Clavier: 1–9 = pads · Espace = stop · ← → = pages</div>
  <button class="ok" id="btnGo">Bda ▶</button>
</div>

<script>
(()=>{
"use strict";
const COLORS=["#ffb020","#ff4d5e","#3ddc84","#3da9ff","#b36bff","#ff7ad9","#22e0d0","#f5f5f5"];
const QUANTS=[{v:1,l:"1 temps"},{v:4,l:"1 mesure"},{v:8,l:"2 mesures"},{v:16,l:"4 mesures"}];
const $=id=>document.getElementById(id);

/* ---------- state ---------- */
let S={pages:[newPage(98)],cur:0,quant:4,metro:false,master:0.9,stopNow:false};
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36)}
function newPage(bpm){return {id:uid(),bpm,pads:Array(9).fill(null)}}
const page=()=>S.pages[S.cur];

/* ---------- licence ---------- */
const PUBKEY={"kty": "EC", "crv": "P-256", "x": "0EFLpEPzmLMVHztpLXbYyZOWHskWMWCwl93_ZS8JS_g", "y": "ac-nnQVOO5tS1RCPvgrwhmoGPDCQ0tdsKMVLjouzWNo"};
const DEMO_PADS=3;
let LIC={ok:false,email:""},DEVICE="";
const B32="0123456789ABCDEFGHJKMNPQRSTVWXYZ";
function b32(bytes,n){let bits=0,val=0,out="";for(const x of bytes){val=((val<<8)|x)&0xffff;bits+=8;while(bits>=5&&out.length<n){out+=B32[(val>>>(bits-5))&31];bits-=5}}return out}
async function sha(t){return new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)))}
const fmtDev=d=>d.slice(0,4)+"-"+d.slice(4);
function b64uDec(t){t=t.replace(/\s/g,"").replace(/-/g,"+").replace(/_/g,"/");while(t.length%4)t+="=";const bin=atob(t);return Uint8Array.from(bin,c=>c.charCodeAt(0))}
async function licVerify(email,code){
  try{
    const key=await crypto.subtle.importKey("jwk",PUBKEY,{name:"ECDSA",namedCurve:"P-256"},false,["verify"]);
    const sig=b64uDec(code);if(sig.length!==64)return false;
    return await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},key,sig,new TextEncoder().encode("PADRAI27|"+DEVICE+"|"+email.trim().toLowerCase()));
  }catch(e){return false}
}
const isLocked=i=>!LIC.ok&&i>=DEMO_PADS;

/* ---------- storage (IndexedDB) ---------- */
let db=null;
function idbOpen(){return new Promise(res=>{
  try{const r=indexedDB.open("loopads",1);
    r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("files");d.createObjectStore("kv")};
    r.onsuccess=()=>{db=r.result;res(db)};r.onerror=()=>res(null);
  }catch(e){res(null)}})}
function idb(store,mode,fn){return new Promise(res=>{
  if(!db)return res(undefined);
  try{const tx=db.transaction(store,mode);const st=tx.objectStore(store);const r=fn(st);
    tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>res(undefined);
  }catch(e){res(undefined)}})}
const putFile=(k,v)=>idb("files","readwrite",s=>s.put(v,k));
const getFile=k=>idb("files","readonly",s=>s.get(k));
const delFile=k=>idb("files","readwrite",s=>s.delete(k));
let saveT=0;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>idb("kv","readwrite",s=>s.put(JSON.stringify(S),"state")),250)}

/* ---------- audio ---------- */
const AC=window.AudioContext||window.webkitAudioContext;
const ctx=new AC({latencyHint:"interactive"});
const master=ctx.createGain();master.connect(ctx.destination);
const buffers={};          // fileKey -> AudioBuffer
const loading=new Set();
const loopCache=new Map(); // fileKey|beats|bpm -> AudioBuffer (exact grid length)
const voices=new Map();    // pageId:i -> voice
let t0=null,tBpm=98;       // transport
const beatDur=()=>60/tBpm;

async function loadKey(k){
  if(buffers[k]||loading.has(k))return;
  loading.add(k);render();
  try{const f=await getFile(k);if(f&&f.data){buffers[k]=await ctx.decodeAudioData(f.data.slice(0))}}
  catch(e){toast("Ma qdertch nqra had l'fichier")}
  loading.delete(k);render();
}
function loopBuf(pad,bpm){
  const src=buffers[pad.fileKey];const key=pad.fileKey+"|"+pad.beats+"|"+bpm;
  if(loopCache.has(key))return loopCache.get(key);
  const len=Math.max(1,Math.round(pad.beats*60/bpm*src.sampleRate));
  const b=ctx.createBuffer(src.numberOfChannels,len,src.sampleRate);
  for(let c=0;c<src.numberOfChannels;c++){
    const d=src.getChannelData(c);b.getChannelData(c).set(d.subarray(0,Math.min(len,d.length)));
  }
  loopCache.set(key,b);return b;
}
function boundary(){
  const now=ctx.currentTime+0.03;const q=S.quant*beatDur();
  return t0+Math.ceil((now-t0)/q)*q;
}
function anyActive(){return voices.size>0}

function tapPad(i){
  if(isLocked(i))return openActivate();
  const pg=page(),pad=pg.pads[i];if(!pad)return openPad(i);
  const id=pg.id+":"+i;const v=voices.get(id);
  if(v){
    if(v.state==="wait"){try{v.src.stop()}catch(e){}v.src.disconnect();voices.delete(id);return render()}
    if(v.stopCommitted)return;
    if(v.stopAt!=null){v.stopAt=null;return render()}
    v.stopAt=S.stopNow||v.oneshot?ctx.currentTime:boundary();return render();
  }
  if(!buffers[pad.fileKey]){loadKey(pad.fileKey);return toast("Ba9i kaytchargea…")}
  let when;
  if(t0==null||!anyActive()){tBpm=pg.bpm;t0=ctx.currentTime+0.04;when=t0;nextClick=null}
  else{when=boundary();if(pg.bpm!==tBpm)toast("Rd lbal: had page "+pg.bpm+" w tempo daba "+tBpm)}
  const src=ctx.createBufferSource();const g=ctx.createGain();g.gain.value=pad.vol;
  const isLoop=pad.mode!=="oneshot";
  src.buffer=isLoop?loopBuf(pad,pg.bpm):buffers[pad.fileKey];
  src.loop=isLoop;
  src.connect(g).connect(master);src.start(when);
  const v2={src,g,start:when,dur:src.buffer.duration,state:"wait",stopAt:null,stopCommitted:false,oneshot:!isLoop,color:pad.color};
  src.onended=()=>{if(voices.get(id)===v2){voices.delete(id);render()}};
  voices.set(id,v2);render();
}
function stopAll(){
  if(!voices.size)return;
  const pending=[...voices.values()].some(v=>v.stopAt!=null);
  const t=pending||S.stopNow?ctx.currentTime:boundary();
  for(const [id,v] of voices){
    if(v.state==="wait"){try{v.src.stop()}catch(e){}voices.delete(id);continue}
    if(pending||S.stopNow){try{v.src.stop()}catch(e){}voices.delete(id)}
    else if(!v.stopCommitted)v.stopAt=t;
  }
  render();
}

/* metronome */
let nextClick=null;
function click(t,acc){
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.frequency.value=acc?1600:1000;g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(acc?0.5:0.3,t+0.002);g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
  o.connect(g).connect(master);o.start(t);o.stop(t+0.06);
}
setInterval(()=>{
  const now=ctx.currentTime;
  for(const v of voices.values()){
    if(v.stopAt!=null&&!v.stopCommitted&&v.stopAt-now<0.15){
      try{v.src.stop(Math.max(v.stopAt,now))}catch(e){}v.stopCommitted=true;
    }
  }
  if(!S.metro||t0==null||!voices.size){nextClick=null;return}
  const bd=beatDur();
  if(nextClick==null)nextClick=t0+Math.max(0,Math.ceil((now-t0)/bd))*bd;
  while(nextClick<now+0.12){
    const n=Math.round((nextClick-t0)/bd);if(nextClick>=now-0.01)click(nextClick,n%4===0);nextClick+=bd;
  }
},25);

/* ---------- render ---------- */
let editing=false;
function render(){
  // tabs
  const live=new Set([...voices.keys()].map(k=>k.split(":")[0]));
  $("tabs").innerHTML=S.pages.map((p,i)=>`<div class="tab ${i===S.cur?"on":""}" data-i="${i}">${p.bpm}<small>BPM</small>${live.has(p.id)?'<span class="live"></span>':""}</div>`).join("")+`<div class="tab add" id="addPage">+</div>`;
  // bpm
  const shown=voices.size?tBpm:page().bpm;
  $("bpm").innerHTML=shown+"<small>BPM</small>";
  $("btnEdit").classList.toggle("on",editing);
  $("btnKey").style.display=LIC.ok?"none":"";
  $("btnStop").classList.toggle("arm",[...voices.values()].some(v=>v.stopAt!=null));
  document.body.classList.toggle("editing",editing);
  // pads
  const pg=page();
  $("grid").innerHTML=pg.pads.map((p,i)=>{
    if(isLocked(i))return `<div class="pad locked" data-i="${i}"><span class="num">${i+1}</span><span class="lk">🔒</span></div>`;
    if(!p)return `<div class="pad empty" data-i="${i}"><span class="num">${i+1}</span><span class="plus">+</span></div>`;
    const bars=p.beats%4===0?(p.beats/4)+" mes":p.beats+" t";
    const ld=!buffers[p.fileKey];
    return `<div class="pad ${ld?"loading":""}" data-i="${i}" style="--c:${p.color}"><div class="fill"></div><div class="ring"></div><span class="num">${i+1}</span><div class="nm">${esc(p.name)}</div><div class="inf">${p.mode==="oneshot"?"one-shot":bars}${p.vol<0.99?" · "+Math.round(p.vol*100)+"%":""}</div></div>`;
  }).join("");
  padEls=[...$("grid").children];
  frame(true);
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
let padEls=[];
function frame(once){
  const now=ctx.currentTime;const pg=page();
  for(let i=0;i<9;i++){
    const el=padEls[i];if(!el)continue;const v=voices.get(pg.id+":"+i);
    if(v&&v.state==="wait"&&now>=v.start)v.state="play";
    el.classList.toggle("wait",!!v&&v.state==="wait");
    el.classList.toggle("play",!!v&&v.state==="play");
    el.classList.toggle("stopping",!!v&&v.stopAt!=null);
    let p=0;if(v&&v.state==="play"){p=v.oneshot?Math.min(1,(now-v.start)/v.dur):((now-v.start)%v.dur)/v.dur}
    el.style.setProperty("--p",p.toFixed(3));
  }
  // other-page voices state
  for(const v of voices.values())if(v.state==="wait"&&now>=v.start)v.state="play";
  const dots=$("beats").children;
  if(t0!=null&&voices.size&&now>=t0){
    const b=Math.floor((now-t0)/beatDur());
    for(let k=0;k<4;k++){dots[k].classList.toggle("on",k===b%4);dots[k].classList.toggle("first",k===0)}
    $("barno").textContent="mes "+(Math.floor(b/4)+1);
  }else{for(const d of dots)d.classList.remove("on");$("barno").textContent=""}
  if(!once)requestAnimationFrame(()=>frame(false));
}

/* ---------- input ---------- */
$("grid").addEventListener("pointerdown",e=>{
  const el=e.target.closest(".pad");if(!el)return;e.preventDefault();
  ctx.resume();const i=+el.dataset.i;
  if(isLocked(i))return openActivate();
  if(editing)return openPad(i);
  tapPad(i);
});
$("tabs").addEventListener("click",e=>{
  if(e.target.closest("#addPage"))return addPage();
  const t=e.target.closest(".tab");if(!t)return;
  const i=+t.dataset.i;
  if(i===S.cur&&editing)return openPage();
  S.cur=i;save();render();
});
let lp=0;
$("tabs").addEventListener("pointerdown",e=>{const t=e.target.closest(".tab:not(.add)");if(!t)return;
  lp=setTimeout(()=>{S.cur=+t.dataset.i;render();openPage()},550)});
["pointerup","pointercancel","pointerleave"].forEach(ev=>$("tabs").addEventListener(ev,()=>clearTimeout(lp)));
$("btnEdit").onclick=()=>{editing=!editing;render();if(editing)toast("Mode edit: brk 3la pad bach tbdlo, w 3la page bach tbdl tempo")};
$("btnStop").onclick=()=>{ctx.resume();stopAll()};
$("btnSet").onclick=openSettings;
$("btnKey").onclick=()=>openActivate();
$("scrim").onclick=closeSheet;
document.addEventListener("keydown",e=>{
  if(e.repeat||$("sheet").classList.contains("on")||/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if($("start").style.display!=="none")return;
  const m=e.code.match(/^(Digit|Numpad)([1-9])$/);
  ctx.resume();
  if(m){e.preventDefault();const i=+m[2]-1;const el=padEls[i];if(el){el.classList.add("hit");setTimeout(()=>el.classList.remove("hit"),90)}tapPad(i);return}
  if(e.code==="Space"){e.preventDefault();stopAll();return}
  if(e.code==="ArrowRight"&&S.cur<S.pages.length-1){S.cur++;save();render()}
  if(e.code==="ArrowLeft"&&S.cur>0){S.cur--;save();render()}
});

/* ---------- sheets ---------- */
function openSheet(html){$("sheet").innerHTML=html;$("sheet").classList.add("on");$("scrim").classList.add("on")}
function closeSheet(){$("sheet").classList.remove("on");$("scrim").classList.remove("on");render()}
let tt=0;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2600)}

function addPage(){
  if(!LIC.ok&&S.pages.length>=1)return openActivate();
  const last=page().bpm;S.pages.push(newPage(last));S.cur=S.pages.length-1;save();render();openPage(true);
}
function openPage(isNew){
  const pg=page();
  openSheet(`<h3>${isNew?"Page jdida":"Page"} — tempo</h3>
  <div class="row"><button class="ib" id="m5">−5</button><button class="ib" id="m1">−1</button>
  <input type="number" id="bpmIn" value="${pg.bpm}" min="40" max="240" inputmode="numeric" style="text-align:center;font-size:22px;font-weight:800">
  <button class="ib" id="p1">+1</button><button class="ib" id="p5">+5</button></div>
  <p class="note">Kol loop f had l'page khass tkon msjla b had tempo. Ila bdlti tempo, toul dyal loops (b temps) kayb9a kifma huwa.</p>
  <div class="acts">${S.pages.length>1?'<button class="danger" id="delPg">Ms7 page</button>':""}<button class="ok" id="okPg">Safi</button></div>`);
  const inp=$("bpmIn");
  const set=v=>{v=Math.max(40,Math.min(240,Math.round(v)||pg.bpm));pg.bpm=v;inp.value=v;save();render()};
  $("m5").onclick=()=>set(pg.bpm-5);$("m1").onclick=()=>set(pg.bpm-1);
  $("p1").onclick=()=>set(pg.bpm+1);$("p5").onclick=()=>set(pg.bpm+5);
  inp.onchange=()=>set(+inp.value);
  $("okPg").onclick=closeSheet;
  if($("delPg"))$("delPg").onclick=()=>{
    const b=$("delPg");if(!b.dataset.sure){b.dataset.sure=1;b.textContent="Mt2kd? 3awd brk";return}
    for(let i=0;i<9;i++){const v=voices.get(pg.id+":"+i);if(v){try{v.src.stop()}catch(e){}voices.delete(pg.id+":"+i)}}
    const keys=pg.pads.filter(Boolean).map(p=>p.fileKey);
    S.pages.splice(S.cur,1);S.cur=Math.max(0,S.cur-1);keys.forEach(gcFile);save();closeSheet();
  };
}
function gcFile(k){
  if(!k)return;const used=S.pages.some(p=>p.pads.some(x=>x&&x.fileKey===k));
  if(!used){delFile(k);delete buffers[k];for(const key of [...loopCache.keys()])if(key.startsWith(k+"|"))loopCache.delete(key)}
}
function autoBeats(dur,bpm){return Math.max(1,Math.round(dur*bpm/60))}

function openPad(i){
  const pg=page();const pad=pg.pads[i];const id=pg.id+":"+i;
  const buf=pad&&buffers[pad.fileKey];
  let info="";
  if(buf){
    const exact=buf.duration*pg.bpm/60;const grid=pad.beats*60/pg.bpm;
    const diff=Math.abs(buf.duration-grid)/grid;
    info=`<p class="note">Fichier: ${buf.duration.toFixed(2)} s ≈ ${exact.toFixed(2)} temps f ${pg.bpm} BPM.<br>
    Loop ghadi ydor kol <b>${grid.toFixed(2)} s</b>.${diff>0.03?'<br><span class="warn">⚠ Toul dyal fichier ma mqadach m3a had l3dad dyal temps — chof tempo wla 3dad temps.</span>':""}</p>`;
  }
  openSheet(`<h3>Pad ${i+1}</h3>
  <button class="file" id="pickBtn" type="button">📁 ${pad?"Bdl l'fichier":"Zid loop"} (wav, mp3, mp4…)</button><input type="file" id="fileIn" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
  ${pad?`
  <div class="row"><label>Smiya</label><input type="text" id="nm" value="${esc(pad.name)}"></div>
  <div class="row"><label>Mode</label><div class="seg"><button id="mLoop" class="${pad.mode!=="oneshot"?"on":""}">Loop</button><button id="mOne" class="${pad.mode==="oneshot"?"on":""}">One-shot</button></div></div>
  <div class="row"><label>Toul</label><button class="ib" id="bm4">−mes</button><button class="ib" id="bm1">−1</button>
    <div class="big" id="bt">${pad.beats}<div class="note">temps (${(pad.beats/4).toFixed(2).replace(/\.00$/,"")} mes)</div></div>
    <button class="ib" id="bp1">+1</button><button class="ib" id="bp4">+mes</button></div>
  ${info}
  <div class="row"><label>Volume</label><input type="range" id="vol" min="0" max="1.5" step="0.01" value="${pad.vol}"><span id="volv" style="min-width:42px;text-align:right">${Math.round(pad.vol*100)}%</span></div>
  <div class="row"><label>Lon</label><div class="sw">${COLORS.map(c=>`<i data-c="${c}" style="background:${c}" class="${c===pad.color?"on":""}"></i>`).join("")}</div></div>
  <div class="acts"><button class="danger" id="clr">Ms7 pad</button><button class="ok" id="okP">Safi</button></div>`
  :`<p class="note">Khtar loop mn telephone dyalk. L'app kat7sb toul dyalha automatiquement 3la 7sab tempo dyal had l'page (${pg.bpm} BPM).</p>`}`);

  $("pickBtn").onclick=()=>{try{$("fileIn").value="";$("fileIn").click()}catch(e){toast("7ll had l'page f Chrome")}};
  $("fileIn").onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    toast("Kanchargi "+f.name+"…");
    let data,b;
    try{data=await f.arrayBuffer();b=await ctx.decodeAudioData(data.slice(0))}
    catch(err){return toast("Ma qdertch nqra had l'fichier. Jarrab wav wla mp3.")}
    const k="f"+uid();buffers[k]=b;
    const ok=await putFile(k,{data,name:f.name,type:f.type});
    const v=voices.get(id);if(v){try{v.src.stop()}catch(e){}voices.delete(id)}
    const old=pad&&pad.fileKey;
    pg.pads[i]={name:f.name.replace(/\.[^.]+$/,""),
      fileKey:k,beats:autoBeats(b.duration,pg.bpm),vol:pad?pad.vol:1,mode:pad?pad.mode:"loop",
      color:pad?pad.color:COLORS[i%COLORS.length]};
    gcFile(old);save();
    if(ok===undefined&&!db)toast("Rd lbal: l'app ma qdratch tsjl — ghadi ytms7 mlli tsdha");
    openPad(i);
  };
  if(!pad)return;
  $("nm").oninput=e=>{pad.name=e.target.value||"Loop";save()};
  $("mLoop").onclick=()=>{pad.mode="loop";save();openPad(i)};
  $("mOne").onclick=()=>{pad.mode="oneshot";save();openPad(i)};
  const setB=n=>{pad.beats=Math.max(1,n);save();openPad(i)};
  $("bm4").onclick=()=>setB(pad.beats-4);$("bm1").onclick=()=>setB(pad.beats-1);
  $("bp1").onclick=()=>setB(pad.beats+1);$("bp4").onclick=()=>setB(pad.beats+4);
  $("vol").oninput=e=>{pad.vol=+e.target.value;$("volv").textContent=Math.round(pad.vol*100)+"%";
    const v=voices.get(id);if(v)v.g.gain.setTargetAtTime(pad.vol,ctx.currentTime,0.02);save()};
  $("sheet").querySelectorAll(".sw i").forEach(el=>el.onclick=()=>{pad.color=el.dataset.c;save();openPad(i)});
  $("clr").onclick=()=>{
    const b=$("clr");if(!b.dataset.sure){b.dataset.sure=1;b.textContent="Mt2kd? 3awd brk";return}
    const v=voices.get(id);if(v){try{v.src.stop()}catch(e){}voices.delete(id)}
    const k=pad.fileKey;pg.pads[i]=null;gcFile(k);save();closeSheet();
  };
  $("okP").onclick=closeSheet;
}

function openActivate(){
  if(LIC.ok)return;
  openSheet(`<h3>🔑 Activation</h3>
  <p class="note">Version démo: ghir ${DEMO_PADS} pads w page wa7da. Bach t7ll kolchi, sift <b>code appareil</b> w <b>Gmail</b> dyalk l Simo, w ghaysift lik code d'activation.</p>
  <div class="devcode" id="devc">${fmtDev(DEVICE)}</div>
  <div class="acts" style="margin-top:8px"><button id="cpDev">Copier code appareil</button></div>
  <div class="row"><label>Gmail</label><input type="text" id="licMail" inputmode="email" autocomplete="email" placeholder="exemple@gmail.com"></div>
  <textarea id="licCode" placeholder="L9 hna code d'activation"></textarea>
  <p class="note" id="licMsg"></p>
  <div class="acts"><button id="cancelA">Rj3</button><button class="ok" id="doAct">Activer</button></div>`);
  $("cpDev").onclick=async()=>{try{await navigator.clipboard.writeText(fmtDev(DEVICE));toast("Tcopia ✔")}catch(e){const r=document.createRange();r.selectNodeContents($("devc"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Copier b yddik")}};
  $("cancelA").onclick=closeSheet;
  $("doAct").onclick=async()=>{
    const em=$("licMail").value.trim().toLowerCase(),cd=$("licCode").value.trim();
    if(!em||!cd){$("licMsg").innerHTML='<span class="warn">Dkhl Gmail w code.</span>';return}
    if(await licVerify(em,cd)){
      const l=JSON.stringify({email:em,code:cd});
      try{localStorage.setItem("padrai_lic",l)}catch(e){}
      await idb("kv","readwrite",st=>st.put(l,"lic"));
      LIC={ok:true,email:em};$("licMsg").innerHTML='<span class="okmsg">✔ Tactivat! Mbrouk.</span>';
      setTimeout(closeSheet,900);
    }else $("licMsg").innerHTML='<span class="warn">Code ma s7i7ch. T2kd mn Gmail w l9 l code kaml.</span>';
  };
}
function openSettings(){
  openSheet(`<h3>Réglages</h3>
  <div class="row"><label>Quantize</label><div class="seg">${QUANTS.map(q=>`<button data-q="${q.v}" class="${S.quant===q.v?"on":""}">${q.l}</button>`).join("")}</div></div>
  <p class="note">Mlli tbrk 3la pad, kaytsna had l'blassa (bdya dyal mesure…) 3ad kaydkhl. Nfs l7aja f stop.</p>
  <div class="row"><label>Stop</label><div class="seg"><button id="sq" class="${!S.stopNow?"on":""}">F l'mesure</button><button id="sn" class="${S.stopNow?"on":""}">Direct</button></div></div>
  <div class="row"><label>Métronome</label><div class="seg"><button id="mOff" class="${!S.metro?"on":""}">Off</button><button id="mOn" class="${S.metro?"on":""}">On</button></div></div>
  <div class="row"><label>Master</label><input type="range" id="mv" min="0" max="1.2" step="0.01" value="${S.master}"><span id="mvv" style="min-width:42px;text-align:right">${Math.round(S.master*100)}%</span></div>
  <p class="note">■ Stop: brka wa7da = kolchi ytw9f f l'mesure jaya. Brkti joj = ytw9f daba.<br>
  Loops kaybqaw m7fudin f had telephone (f navigateur). Khli dima l'fichiers l'asliyin 3ndk.</p>
  <p class="note">${LIC.ok?"✔ Licence: <b>"+esc(LIC.email)+"</b>":"Version démo — <a href='#' id='goAct' style='color:var(--acc)'>Activer</a>"}<br>Code appareil: ${fmtDev(DEVICE)}</p>
  <div class="acts"><button class="ok" id="okS">Safi</button></div>`);
  if($("goAct"))$("goAct").onclick=e=>{e.preventDefault();openActivate()};
  $("sheet").querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{S.quant=+b.dataset.q;save();openSettings()});
  $("sq").onclick=()=>{S.stopNow=false;save();openSettings()};
  $("sn").onclick=()=>{S.stopNow=true;save();openSettings()};
  $("mOff").onclick=()=>{S.metro=false;save();openSettings()};
  $("mOn").onclick=()=>{S.metro=true;save();openSettings()};
  $("mv").oninput=e=>{S.master=+e.target.value;master.gain.setTargetAtTime(S.master,ctx.currentTime,0.02);$("mvv").textContent=Math.round(S.master*100)+"%";save()};
  $("okS").onclick=closeSheet;
}

/* ---------- boot ---------- */
async function getDevice(){
  try{if(window.AndroidBridge&&AndroidBridge.deviceId){const id=AndroidBridge.deviceId();if(id)return b32(await sha("padrai|"+id),8)}}catch(e){}
  let d=null;try{d=localStorage.getItem("padrai_dev")}catch(e){}
  if(!d)d=await idb("kv","readonly",st=>st.get("dev"));
  if(!d)d=b32(crypto.getRandomValues(new Uint8Array(8)),8);
  try{localStorage.setItem("padrai_dev",d)}catch(e){}
  idb("kv","readwrite",st=>st.put(d,"dev"));
  return d;
}
async function loadLic(){
  let l=null;try{l=JSON.parse(localStorage.getItem("padrai_lic")||"null")}catch(e){}
  if(!l){try{const r=await idb("kv","readonly",st=>st.get("lic"));if(r)l=JSON.parse(r)}catch(e){}}
  if(l&&l.email&&l.code&&await licVerify(l.email,l.code))LIC={ok:true,email:l.email.trim().toLowerCase()};
}
async function boot(){
  await idbOpen();
  DEVICE=await getDevice();await loadLic();
  try{const raw=await idb("kv","readonly",s=>s.get("state"));
    if(raw){const o=JSON.parse(raw);if(o&&Array.isArray(o.pages)&&o.pages.length)S=Object.assign(S,o)}}catch(e){}
  S.cur=Math.min(S.cur,S.pages.length-1);
  master.gain.value=S.master;
  render();requestAnimationFrame(()=>frame(false));
  S.pages.forEach(p=>p.pads.forEach(x=>x&&loadKey(x.fileKey)));
}
try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch(e){}
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){navigator.serviceWorker.register("sw.js").catch(()=>{})}
$("btnGo").onclick=async()=>{
  $("start").style.display="none";
  try{ctx.resume()}catch(e){}
  try{if(navigator.wakeLock)await navigator.wakeLock.request("screen")}catch(e){}
};
boot();
})();
</script>
