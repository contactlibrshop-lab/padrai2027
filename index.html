/* VOICE occasion: a stage instrument, dark and precise
   IDEA the app is the firmware of a hardware sampler pad: matte chassis, rubber pads with LED rims, backlit LCD
   PICTURE the 3x3 pad deck itself, LED rims tracing each loop's position
   COLOUR matte graphite, LCD ice-blue, LED cyan with per-pad colours, chrome/inox lettering
   TYPE Orbitron (chrome lettering) + Share Tech Mono (LCD) + Inter/Tajawal (menus)
   LAYOUT phone: brand strip, LCD + knob, hardware buttons, pad deck filling the rest */
:root{
  --ch0:#0b0c0e;--ch1:#16181c;--ch2:#1d2025;--ch3:#262a30;--edge:#30343b;
  --txt:#e6eaf0;--mute:#8d96a3;--led:#19c3ff;--red:#ff3b55;--grn:#2ee59d;--amb:#ffb21a;
  --lcd1:#0a2a5c;--lcd2:#0f3f86;--lcdt:#bfe9ff;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",Tahoma,sans-serif;--mono:"PSMono",ui-monospace,monospace;--disp:"PSDisp",system-ui,sans-serif;
}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
@media(pointer:coarse){#pHint{display:none}}
html,body{margin:0;height:100%;background:#050506;color:var(--txt);font:15px/1.4 var(--ui);overflow:hidden;
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
/* ---------- chassis ---------- */
.dev{position:relative;height:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column;
  padding:calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));

const PS8={
  DUR:[30,90,180,365,0],               // 1m,3m,6m,1an, a vie
  EPOCH:Date.UTC(2026,0,1),
  MOD:100000000n,
  day(t){return Math.floor(((t??Date.now())-this.EPOCH)/864e5)},
  hex(h){return Uint8Array.from(h.match(/../g).map(x=>parseInt(x,16)))},
  async key(sec){return crypto.subtle.importKey("raw",this.hex(sec),{name:"HMAC",hash:"SHA-256"},false,["sign"])},
  async u32(k,msg){const b=new Uint8Array(await crypto.subtle.sign("HMAC",k,new TextEncoder().encode(msg)));return ((b[0]<<24)>>>0)+(b[1]<<16)+(b[2]<<8)+b[3]},
  inv(a,m){let [r0,r1,s0,s1]=[a,m,1n,0n];while(r1){const q=r0/r1;[r0,r1]=[r1,r0-q*r1];[s0,s1]=[s1,s0-q*s1]}return ((s0%m)+m)%m},
  async ab(k){let a=BigInt(await this.u32(k,"A"))%this.MOD;if(a%2n===0n)a+=1n;if(a%5n===0n)a+=2n;const b=BigInt(await this.u32(k,"B"))%this.MOD;return {a,b}},
  norm(e){return String(e||"").trim().toLowerCase()},
  async make(sec,email,durIdx,day){
    const k=await this.key(sec),{a,b}=await this.ab(k);
    const p=durIdx*128+(day%128);
    const m=(await this.u32(k,"PS27|"+this.norm(email)+"|"+p))%97656;
    const N=BigInt(p*97656+m);
    return String((N*a+b)%this.MOD).padStart(8,"0");
  },
  async check(sec,email,code,now){
    code=String(code||"").replace(/\D/g,"");if(code.length!==8)return null;
    const k=await this.key(sec),{a,b}=await this.ab(k);
    const N=Number((((BigInt(code)-b)%this.MOD+this.MOD)*this.inv(a,this.MOD))%this.MOD);
    const p=Math.floor(N/97656),m=N%97656;if(p>1023)return null;
    const di=p>>7,r=p&127;if(di>=this.DUR.length)return null;
    if((await this.u32(k,"PS27|"+this.norm(email)+"|"+p))%97656!==m)return null;
    const today=this.day(now);const issue=today-(((today-r)%128)+128)%128;
    const dd=this.DUR[di];
    return {issue,durIdx:di,days:dd,exp:dd?this.EPOCH+(issue+dd+1)*864e5:null};
  }
};

let db=null;
function idbOpen(){return new Promise(res=>{
  try{const r=indexedDB.open("loopads",1);
    r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("files");d.createObjectStore("kv")};
    r.onsuccess=()=>{db=r.result;res(db)};r.onerror=()=>res(null);
  }catch(e){res(null)}})}
function idb(store,mode,fn){return new Promise(res=>{
  if(!db)return res(undefined);
  try{const tx=db.transaction(store,mode);const st=tx.objectStore(store);const r=fn(st);
    tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>res(undefined);
  }catch(e){res(undefined)}})}
const putFile=(k,v)=>idb("files","readwrite",s=>s.put(v,k));

/* ---------- audio engine ---------- */
const AC=window.AudioContext||window.webkitAudioContext;
const ctx=new AC({latencyHint:"interactive"});
const master=ctx.createGain();master.connect(ctx.destination);
const buffers={},loading=new Set(),loopCache=new Map(),voices=new Map();
let t0=null,tBpm=98;
const beatDur=()=>60/tBpm;
async function loadKey(k){
  if(buffers[k]||loading.has(k))return;
  loading.add(k);render();
  try{const f=await getFile(k);if(f&&f.data){buffers[k]=await ctx.decodeAudioData(f.data.slice(0))}}
  catch(e){toast(T().cantRead)}
  loading.delete(k);render();
}
function loopBuf(pad,bpm){
  const src=buffers[pad.fileKey];const key=pad.fileKey+"|"+pad.beats+"|"+bpm;
  if(loopCache.has(key))return loopCache.get(key);
  const len=Math.max(1,Math.round(pad.beats*60/bpm*src.sampleRate));
  const b=ctx.createBuffer(src.numberOfChannels,len,src.sampleRate);
  for(let c=0;c<src.numberOfChannels;c++){const d=src.getChannelData(c);b.getChannelData(c).set(d.subarray(0,Math.min(len,d.length)))}
  loopCache.set(key,b);return b;
}
function boundary(){const now=ctx.currentTime+0.03;const q=S.quant*beatDur();return t0+Math.ceil((now-t0)/q)*q}
let lastMsg="";
function lcdMsg(m){lastMsg=m;const e=$("lcdMsg");if(e)e.textContent=m}
function tapPad(i){
  const pg=page(),pad=pg.pads[i];if(!pad)return openPad(i);
  const id=pg.id+":"+i;const v=voices.get(id);
  if(v){
    if(v.state==="wait"){try{v.src.stop()}catch(e){}v.src.disconnect();voices.delete(id);return render()}
    if(v.stopCommitted)return;
    if(v.stopAt!=null){v.stopAt=null;return render()}
    v.stopAt=S.stopNow||v.oneshot?ctx.currentTime:boundary();return render();
  }
  if(!buffers[pad.fileKey]){loadKey(pad.fileKey);return toast(T().loading)}
  let when;
  if(t0==null||!voices.size){tBpm=pg.bpm;t0=ctx.currentTime+0.04;when=t0;nextClick=null}
  else{when=boundary();if(pg.bpm!==tBpm)toast(T().tempoWarn(pg.bpm,tBpm))}
  const src=ctx.createBufferSource();const g=ctx.createGain();g.gain.value=pad.vol;
  const isLoop=pad.mode!=="oneshot";
  src.buffer=isLoop?loopBuf(pad,pg.bpm):buffers[pad.fileKey];src.loop=isLoop;
  src.connect(g).connect(master);src.start(when);
  const v2={src,g,start:when,dur:src.buffer.duration,state:"wait",stopAt:null,stopCommitted:false,oneshot:!isLoop};
  src.onended=()=>{if(voices.get(id)===v2){voices.delete(id);render()}};
  voices.set(id,v2);lcdMsg("▶ "+pad.name);render();
}
function stopAll(){
  if(!voices.size)return;
  const pending=[...voices.values()].some(v=>v.stopAt!=null);
  const t=pending||S.stopNow?ctx.currentTime:boundary();
  for(const [id,v] of voices){
    if(v.state==="wait"){try{v.src.stop()}catch(e){}voices.delete(id);continue}
    if(pending||S.stopNow){try{v.src.stop()}catch(e){}voices.delete(id)}
    else if(!v.stopCommitted)v.stopAt=t;
  }
  lcdMsg("■ STOP");render();
}
let nextClick=null;
function click(t,acc){
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.frequency.value=acc?1600:1000;g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(acc?0.5:0.3,t+0.002);g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
  o.connect(g).connect(master);o.start(t);o.stop(t+0.06);
}
setInterval(()=>{
  const now=ctx.currentTime;
  for(const v of voices.values()){if(v.stopAt!=null&&!v.stopCommitted&&v.stopAt-now<0.15){try{v.src.stop(Math.max(v.stopAt,now))}catch(e){}v.stopCommitted=true}}
  if(!S.metro||t0==null||!voices.size){nextClick=null;return}
  const bd=beatDur();
  if(nextClick==null)nextClick=t0+Math.max(0,Math.ceil((now-t0)/bd))*bd;
  while(nextClick<now+0.12){const n=Math.round((nextClick-t0)/bd);if(nextClick>=now-0.01)click(nextClick,n%4===0);nextClick+=bd}
},25);

function frame(once){
  const now=ctx.currentTime,pg=page(),t=T();
  let playing=0,armed=0;
  for(const v of voices.values()){if(v.state==="wait"&&now>=v.start)v.state="play";if(v.state==="play")playing++;else armed++}
  for(let i=0;i<9;i++){
    const el=padEls[i];if(!el)continue;const v=voices.get(pg.id+":"+i);
    el.classList.toggle("wait",!!v&&v.state==="wait");
    el.classList.toggle("play",!!v&&v.state==="play");
    el.classList.toggle("stopping",!!v&&v.stopAt!=null);
    let p=0;if(v&&v.state==="play")p=v.oneshot?Math.min(1,(now-v.start)/v.dur):((now-v.start)%v.dur)/v.dur;
    el.style.setProperty("--p",p.toFixed(3));
  }
  const leds=$("beats").children;
  if(t0!=null&&voices.size&&now>=t0){
    const b=Math.floor((now-t0)/beatDur());
    for(let k=0;k<4;k++){leds[k].classList.toggle("on",k===b%4);leds[k].classList.toggle("one",k===0)}
    $("lcdBar").textContent=String(Math.floor(b/4)+1).padStart(3,"0")+":"+(b%4+1);
  }else{for(const d of leds)d.classList.remove("on");$("lcdBar").textContent="---:-"}
  $("lcdState").textContent=playing?t.play+" "+playing:armed?t.wait:t.ready;
  if(!once)requestAnimationFrame(()=>frame(false));
}

  if(!r){fails++;if(fails>=5)lockUntil=now+Math.min(300,30*2**(fails-5))*1000;return aMsg(`<span class="warn">${t.badOtp}</span>`)}
  if(r.exp&&r.exp<now)return aMsg(`<span class="warn">${t.expired}</span>`);
  fails=0;LICC={email:m,exp:r.exp,maxSeen:now};lsSet("ps27_lic8",LICC);
  aMsg(`<span class="okmsg">${t.okA(r.exp?fmtDate(r.exp):"")}</span>`);
  setTimeout(()=>{$("act").hidden=true;$("power").classList.remove("locked");powerOn()},1100);
};
$("aOtp").addEventListener("keydown",e=>{if(e.key==="Enter")$("aGo").onclick()});
$("bPower").onclick=()=>{if(licValid())return powerOn();showAct(LICC?`<span class="warn">${T().expired}</span>`:"")};
async function powerOn(){
  $("power").style.display="none";
  try{ctx.resume()}catch(e){}
  const d=$("dev");d.classList.add("boot");lcdMsg(T().boot1);
  setTimeout(()=>{d.classList.remove("boot");lcdMsg(T().boot2)},1600);
  try{if(navigator.wakeLock)await navigator.wakeLock.request("screen")}catch(e){}
};
boot();
}
</script>
