name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Make Android project
        run: |
          set -e
          P=android
          J=$P/app/src/main/java/ma/simo/padrai
          mkdir -p $J $P/app/src/main/assets $P/app/src/main/res/mipmap-xxxhdpi
          cp index.html manifest.json icon-192.png $P/app/src/main/assets/
          sed -i 's/"serviceWorker" in navigator/false/' $P/app/src/main/assets/index.html
          cp icon-192.png $P/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cat > $P/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "PadSimo2027"
          include ':app'
          EOF
          cat > $P/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > $P/gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF
          cat > $P/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'ma.simo.padrai'
              compileSdk 34
              defaultConfig {
                  applicationId 'ma.simo.padsimo2027'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
          EOF
          cat > $P/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Pad Simo 2027" android:icon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.Black.NoTitleBar" android:hardwareAccelerated="true">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:screenOrientation="portrait" android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > $J/MainActivity.java <<'EOF'
          package ma.simo.padrai;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.webkit.WebViewAssetLoader;

          public class MainActivity extends Activity {
              private static final int PICK = 42;
              private WebView web;
              private ValueCallback<Uri[]> pending;

              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(false);
                  web.addJavascriptInterface(new Object() {
                      @JavascriptInterface public String deviceId() {
                          String id = Settings.Secure.getString(getContentResolver(), Settings.Secure.ANDROID_ID);
                          return id == null ? "" : id;
                      }
                  }, "AndroidBridge");
                  final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this)).build();
                  web.setWebViewClient(new WebViewClient() {
                      @Override public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                          return loader.shouldInterceptRequest(r.getUrl());
                      }
                  });
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          if (pending != null) pending.onReceiveValue(null);
                          pending = cb;
                          Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                          i.addCategory(Intent.CATEGORY_OPENABLE);
                          i.setType("*/*");
                          i.putExtra(Intent.EXTRA_MIME_TYPES, new String[]{"audio/*", "video/*", "application/octet-stream"});
                          try { startActivityForResult(i, PICK); }
                          catch (Exception e) { pending = null; return false; }
                          return true;
                      }
                  });
                  if (b != null) web.restoreState(b);
                  else web.loadUrl("https://appassets.androidplatform.net/assets/index.html");
              }

              @Override protected void onActivityResult(int req, int res, Intent data) {
                  if (req == PICK && pending != null) {
                      Uri[] r = null;
                      if (res == RESULT_OK && data != null && data.getData() != null) r = new Uri[]{data.getData()};
                      pending.onReceiveValue(r);
                      pending = null;
                  } else super.onActivityResult(req, res, data);
              }

              @Override protected void onSaveInstanceState(Bundle o) { super.onSaveInstanceState(o); web.saveState(o); }
              @Override public void onBackPressed() { moveTaskToBack(true); }
          }
          EOF
      - name: Build
        run: |
          cd android
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../PadSimo2027.apk
      - name: Publish link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk -y --cleanup-tag || true
          gh release create apk PadSimo2027.apk --title "Pad Simo 2027 - APK" --notes "Telecharger PadSimo2027.apk w installiha f Android."
